services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      # Lowest priority ensures this only catches what backend doesn't
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    expose:
      - "5001"
      - "9001"
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/data/db.sqlite3
    volumes:
      - backend-data:/data
    labels:
      - "traefik.enable=true"

      # 1. REST API (/api)
      - "traefik.http.routers.backend-rest.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend-rest.entrypoints=web"
      - "traefik.http.routers.backend-rest.priority=100"
      - "traefik.http.routers.backend-rest.middlewares=strip-api"
      - "traefik.http.routers.backend-rest.service=backend-rest-svc"
      - "traefik.http.services.backend-rest-svc.loadbalancer.server.port=5001"

      # 2. WEBSOCKETS (/ws)
      - "traefik.http.routers.backend-ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.backend-ws.entrypoints=web"
      - "traefik.http.routers.backend-ws.priority=100"
      - "traefik.http.routers.backend-ws.middlewares=strip-ws"
      - "traefik.http.routers.backend-ws.service=backend-ws-svc"
      - "traefik.http.services.backend-ws-svc.loadbalancer.server.port=9001"

      # Middlewares
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip-ws.stripprefix.prefixes=/ws"
    restart: unless-stopped

volumes:
  backend-data: